name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke test with real NDI feeds
        env:
          QT_QPA_PLATFORM: offscreen
        timeout-minutes: 3
        run: python ci_smoke.py

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "NDI-Live-Switcher"
          --collect-all NDIlib
          ndi_live.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NDI-Live-Switcher-windows
          path: dist/NDI-Live-Switcher.exe

      - name: Point the "latest" tag at this build
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NDI Live Switcher (latest build)
          prerelease: false
          make_latest: true
          files: dist/NDI-Live-Switcher.exe
